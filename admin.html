<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>پنل مدیریت موج آیس</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="data.js"></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <div id="login" class="login">
      <form id="loginForm" novalidate>
        <div class="login-icon">🍦</div>
        <h1>مدیریت موج آیس</h1>
        <p>ورود مدیر</p>
        <label class="field"
          ><span>نام کاربری</span
          ><input
            id="user"
            placeholder="نام کاربری"
            autocomplete="username" /><small class="field-error"></small></label
        ><label class="field"
          ><span>رمز عبور</span
          ><input
            id="pass"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password" /><small
            class="field-error"
          ></small></label
        ><button>ورود</button><small id="err"></small>
      </form>
    </div>
    <div id="app" class="hidden">
      <header>
        <b>🍦 پنل مدیریت موج آیس</b>
        <div>
          <a href="./index.html" target="_blank">مشاهده منو</a
          ><button id="logout">خروج</button>
        </div>
      </header>
      <main>
        <div class="heading">
          <div>
            <h1>مدیریت منو</h1>
            <p>افزودن، حذف، ویرایش آیتم‌ها و سربرگ‌ها</p>
          </div>
          <button id="addCat">＋ افزودن سربرگ</button>
        </div>
        <div id="list"></div>
      </main>
    </div>
    <dialog id="catDialog">
      <form id="catForm" class="dialog-form">
        <div class="modal-icon">📁</div>
        <span class="mini-label">CATEGORY</span>
        <h2>سربرگ</h2>
        <p>نام و ایموجی دسته‌بندی را تنظیم کن.</p>
        <input type="hidden" id="catId" /><label class="field"
          >نام سربرگ<input id="catTitle" /><small
            class="field-error"
          ></small></label
        ><label class="field"
          >ایموجی<input id="catEmoji" maxlength="4" /><small
            class="field-error"
          ></small
        ></label>
        <div class="actions">
          <button type="button" class="cancel" onclick="catDialog.close()">
            انصراف</button
          ><button>ذخیره</button>
        </div>
      </form>
    </dialog>
    <dialog id="itemDialog">
      <form id="itemForm" class="dialog-form">
        <div class="modal-icon">🍨</div>
        <span class="mini-label">MENU ITEM</span>
        <h2>آیتم</h2>
        <p>اطلاعات محصول را مرتب وارد کن.</p>
        <input type="hidden" id="itemCat" /><input
          type="hidden"
          id="itemId"
        /><label class="field"
          >نام<input id="itemName" /><small class="field-error"></small></label
        ><label class="field"
          >توضیحات<input id="itemDesc" /><small
            class="field-error"
          ></small></label
        ><label class="field"
          >قیمت (تومان)<input id="itemPrice" type="number" min="0" /><small
            class="field-error"
          ></small></label
        ><label class="field"
          >ایموجی (اختیاری)<input id="itemEmoji" maxlength="4" /><small
            class="field-error"
          ></small></label
        ><label class="field"
          >عکس محصول<input
            id="itemImage"
            placeholder="مثلاً images/waffle.jpg یا آدرس عکس" /><small
            class="field-error"
          ></small></label
        ><label class="file-label">
          <span class="file-icon">📷</span>

          <span class="file-content">
            <strong>انتخاب عکس محصول</strong>
            <small>برای انتخاب عکس کلیک کنید</small>
          </span>

          <span class="file-button">انتخاب عکس</span>

          <input id="itemImageFile" type="file" accept="image/*" />
        </label>

        <div class="upload-progress">
          <div id="progressBar"></div>
        </div>

        <div id="imagePreview" class="image-preview"></div>
        <div class="actions">
          <button type="button" class="cancel" onclick="itemDialog.close()">
            انصراف</button
          ><button>ذخیره</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog" class="confirm-dialog">
      <div class="confirm-box">
        <div id="confirmIcon" class="confirm-icon">✓</div>
        <span id="confirmLabel" class="mini-label">CONFIRM</span>
        <h2 id="confirmTitle">تأیید عملیات</h2>
        <p id="confirmText">آیا از انجام این عملیات مطمئنی؟</p>
        <div class="actions">
          <button type="button" id="confirmCancel" class="cancel">انصراف</button
          ><button type="button" id="confirmOk">تأیید</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
